name: Update VPN Subscriptions

on:
  schedule:
    # 每小时第 7 分钟跑一次(错开整点,避免和别的仓库一起打上游)
    - cron: "7 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-subs
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install python deps
        run: pip install -r requirements.txt

      - name: Download mihomo core
        run: |
          set -e
          ASSET_URL=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest \
            | grep browser_download_url \
            | grep "linux-amd64" \
            | grep -v "go120" \
            | grep -v "\.sha256" \
            | head -n1 \
            | cut -d '"' -f4)
          echo "downloading $ASSET_URL"
          curl -L "$ASSET_URL" -o mihomo.gz
          gunzip mihomo.gz
          mv mihomo* mihomo 2>/dev/null || true
          chmod +x mihomo
          ./mihomo -v

      - name: Run pipeline
        working-directory: scripts
        run: python pipeline.py

      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "chore: refresh subscriptions $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
