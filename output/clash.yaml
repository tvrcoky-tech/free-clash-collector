mixed-port: 7890
mode: rule
log-level: info
ipv6: false
proxies: []
proxy-groups:
- name: ♻️ 自动选优
  type: url-test
  proxies: &id001 []
  url: https://www.gstatic.com/generate_204
  interval: 300
  tolerance: 50
- name: 🚀 手动选择
  type: select
  proxies:
  - ♻️ 自动选优
- name: 🔯 故障转移
  type: fallback
  proxies: *id001
  url: https://www.gstatic.com/generate_204
  interval: 300
rules:
- DOMAIN-SUFFIX,cn,DIRECT
- GEOIP,CN,DIRECT
- MATCH,🚀 手动选择
